#!/usr/bin/env bash
# Shared configuration for local builds and GitHub Actions.
# Edit values here; build/build.sh and .github/workflows/kernel-build.yml both load this file.

# Target architecture and kernel configuration
ARCH="arm64"
SUBARCH="arm64"
DEFCONFIG="enchilada_defconfig"

# Toolchain: clang or gcc
BUILD_COMPILER="clang"
CLANG_BIN="clang"
LLVM_BIN="llvm-"
# For clang + GNU binutils cross tools:
CROSS_COMPILE="aarch64-linux-gnu-"
CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
CLANG_TRIPLE="aarch64-linux-gnu-"

# Build paths (relative paths are resolved from repository root)
OUT_DIR="out"
DIST_DIR="dist"

# Build behavior
JOBS="auto"                    # auto or a positive integer
BUILD_TARGETS="Image.gz dtbs"  # e.g. "Image.gz Image.gz-dtb dtbs modules"
CLEAN_OUTPUT="no"              # yes/no; remove OUT_DIR before configuring
MRPROPER="no"                  # yes/no; run mrproper (implies clean)
USE_CCACHE="no"                # yes/no; requires ccache in PATH
CCACHE_SIZE="5G"

# Kernel version string; empty keeps the kernel Makefile default
LOCALVERSION="-OnePlus-SDM845-KSU"
APPEND_LOCALVERSION="yes"      # yes/no

# Configuration policy
ENABLE_SECCOMP="yes"           # yes/no; enable SECCOMP and SECCOMP_FILTER
VERIFY_SECCOMP="yes"            # yes/no; fail if either option is not enabled
RUN_OLDDEFCONFIG="yes"         # yes/no; normalize .config after changes

# Optional make arguments, split on whitespace (do not use shell quoting here)
EXTRA_MAKE_ARGS=""
