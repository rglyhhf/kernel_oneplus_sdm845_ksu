# OnePlus SDM845 kernel build configuration
# Edit values here; build.sh reads this file.

# Target architecture and kernel defconfig
ARCH="arm64"
DEFCONFIG="enchilada_defconfig"

# Toolchain:
#   clang: LLVM/Clang with GNU cross-binutils available in PATH
#   gcc:   GNU cross-compiler available in PATH
TOOLCHAIN="clang"
CROSS_COMPILE="aarch64-linux-gnu-"
CLANG_TRIPLE="aarch64-linux-gnu-"

# Output directory (relative to repository root unless absolute)
OUT_DIR="out"

# Build targets for this Qualcomm/arm64 kernel
BUILD_TARGETS="Image.gz dtbs"

# Empty means use all available logical CPUs
JOBS=""

# Kernel local version suffix; leave empty to use the defconfig value
LOCALVERSION=""

# Keep the seccomp syscall filtering support enabled in the generated .config
ENABLE_SECCOMP_FILTER="true"
