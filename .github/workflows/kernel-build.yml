name: Kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared build configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          source build/build.conf
          echo "compiler=$BUILD_COMPILER" >> "$GITHUB_OUTPUT"\n          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"
          echo "targets=$BUILD_TARGETS" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libssl-dev \
            libelf-dev lz4 make python3 python-is-python3 pahole device-tree-compiler
          if [[ "${{ steps.config.outputs.compiler }}" == "clang" ]]; then
            sudo apt-get install -y clang lld llvm
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          fi

      - name: Build kernel
        shell: bash
        run: bash build/build.sh

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.config.outputs.defconfig }}-${{ github.sha }}
          path: |
            ${{ steps.config.outputs.out_dir }}/arch/${{ steps.config.outputs.arch }}/boot/Image*
            ${{ steps.config.outputs.out_dir }}/arch/${{ steps.config.outputs.arch }}/boot/dts/**/*.dtb
            ${{ steps.config.outputs.out_dir }}/.config
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
